# Podman Compose Specification for sigap-opt
# Command: podman compose up -d (or podman-compose up -d)

services:
  sigap-opt:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/sigap-opt:latest
    container_name: posix-engine-so
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - DATABASE_URL=file:/app/data/sigap_opt.db
    volumes:
      - sigap-opt-data:/app/data:Z
    healthcheck:
      test: "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  sigap-opt-data:
    name: sigap-opt-data
